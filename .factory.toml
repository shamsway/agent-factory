# agent-factory configuration. Docs: https://github.com/mikeroySoft/factory
# Gate checks proposed by District from: --check

# Fork only: the dispatcher stages upstream main into an `upstream sync:` ticket whenever it
# moves; the host's root needs a remote named `upstream`. Sync PRs merge with operator approval.
[repo]
upstream = "upstream"

[gate]
protected_paths = [".factory.toml", "**/acceptance/**", "**/*review*prompt*", "TRACKING*", "**/TRACKING*", "scripts/privacy-check.py"]
add_only_paths = ["tests/**"]

[[gate.check]]
name = "test"
run = [
    "uv",
    "run",
    "--frozen",
    "--no-managed-python",
    "--extra",
    "publisher",
    "python",
    "-m",
    "unittest",
    "discover",
    "-s",
    "tests",
]
exclusive = false

[[gate.check]]
name = "ruff"
run = ["uvx", "ruff@0.16.10", "check", "."]
exclusive = false

# Report-only: lists surviving mutants of changed factory/ files for the reviewer; exits
# nonzero only when the tool itself fails to run. Runs once per PR head, not per attempt.
[[gate.check]]
name = "mutation"
run = [
    "uv",
    "run",
    "--frozen",
    "--no-managed-python",
    "--extra",
    "publisher",
    "--group",
    "mutation",
    "python",
    "scripts/mutation.py",
]
exclusive = false
when = "pr"

# Fork only: this repository is public. Workers can't see the private denylist (the sandbox
# home is empty), so the host sets FACTORY_PRIVACY_DENYLIST and exposes that file read-only to
# checks; without it the check exits 2 instead of passing on the generic rules alone.
# Text already published on upstream main is not this fork's exposure (sync merges carry it).
[[gate.check]]
name = "privacy"
run = ["python3", "scripts/privacy-check.py", "--range", "origin/main...HEAD", "--require-denylist",
       "--published", "upstream/main"]
exclusive = false

[dashboard]
theme = ".factory-dashboard.css"

[dispatch]
# Fork only: one ticket in flight while the fork's factory is new; the dispatch table is
# repo-owned, so the host config cannot lower the default of 2.
max_active = 1
review_rounds = 3

[release]
# Fork only: releases are cut upstream; a fork release would reuse upstream's version numbers.
auto = false

[manager]
rounds = 3
