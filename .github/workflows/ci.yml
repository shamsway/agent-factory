# Written by `factory init`. The merge stage refuses to land a PR that has no
# passing GitHub check, so this workflow must exist and must pass. Make the
# steps below run the same commands as [[gate.check]] in .factory.toml.
#
# The suite runs as parallel shards (scripts/test-shard.py: every discovered
# test in exactly one shard); `gate` passes only when lint and every shard did.
# Refresh tests/shard-weights.json with `scripts/test-shard.py --measure` when
# the shards drift apart.
name: ci
on:
  pull_request:
  push:
    branches: [main]  # a PR branch already runs through pull_request
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the privacy check reads every commit of the PR
      - uses: astral-sh/setup-uv@v6
      - name: Publication privacy (added lines, commit messages, branch name)
        # Generic rules only here; operator terms live in a private denylist, run locally.
        # Upstream sync merges carry the upstream history and are reviewed separately.
        # Text already on upstream main is published there, not by this fork.
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'sync/')
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.head_ref }}
        run: |
          git fetch --quiet --no-tags https://github.com/mikeroySoft/factory.git main
          python3 scripts/privacy-check.py --range "$BASE...$HEAD" --branch "$BRANCH" --published FETCH_HEAD
      - name: Ruff
        run: uvx ruff@0.16.10 check .
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/publisher-wheels.txt
      - run: python -m pip install '.[atlas,publisher]'
      - name: Prepare required Linux isolation boundary
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap dbus-user-session
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - run: python scripts/test-shard.py --shards 4 --index ${{ matrix.shard }}
        env:
          FACTORY_REQUIRE_ISOLATION: "1"
  gate:
    # The one check the merge stage and branch rules look for: green only when
    # lint and every test shard succeeded (a skipped or cancelled shard fails it).
    needs: [lint, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.lint.result }}" = success
          test "${{ needs.test.result }}" = success
